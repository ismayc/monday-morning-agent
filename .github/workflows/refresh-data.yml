# Refresh data: this season's plays, and the answers behind the explorer page.
#
# The explorer page (docs/episode-1/explorer.html) has buttons for seasons, half, score, and games.
# A page cannot run a program, and nothing should have to run on the viewer's computer to
# change a filter, so this workflow runs the same tool the agent runs, query-plays.mjs,
# once for every combination the buttons can ask for, and commits what it printed to
# docs/episode-1/explorer-data.json. GitHub Pages serves that file.
#
# It also re-downloads the play-by-play seasons from nflverse and rebuilds
# episode-1/data/plays-slim.csv, so a fresh clone has this season as far as it has been
# published.
#
# This is the deterministic half only. No Claude call, no API key, no secret: the agent
# itself runs on your own machine from run-analyst.sh.
#
# Runs daily at 12:30 UTC (5:30 a.m. Pacific, so a Monday morning read is that
# morning's), and by hand from the Actions tab. It commits only when the plays changed.
# Because it commits to main, pull before you push.

name: Refresh data

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on October 19, 2026,
    # partway through the season. Move this by hand once the season is over.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download the seasons and rebuild the slim file
        run: cd episode-1 && ./fetch-data.sh

      - name: Ask the tool every question the explorer page can ask
        run: cd episode-1 && node ./build-explorer-data.mjs

      - name: Commit if the plays changed
        run: |
          if git diff --quiet -- episode-1/data docs/episode-1/explorer-data.json; then
            echo "Nothing new since the last commit; nothing to push."
            exit 0
          fi
          through="$(node -e 'const j=require("./docs/episode-1/explorer-data.json");console.log(j.season2026.latestGame+", weeks "+j.season2026.weeks)')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episode-1/data/plays-slim.csv episode-1/data/plays-slim.meta.json docs/episode-1/explorer-data.json
          git commit -m "data: 2026 through $through"
          git pull --rebase origin main
          git push origin HEAD:main
