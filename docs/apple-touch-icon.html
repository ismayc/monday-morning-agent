<!-- Source for apple-touch-icon.png and favicon-32.png. Square, no rounded corners and no
     transparency: iOS rounds the corners itself and fills transparent ones black.
     Re-render (from docs/, any Chrome; use a throwaway profile):
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --user-data-dir=/tmp/icon-profile \
         --window-size=540,540 --screenshot=icon-540.png "file://$PWD/apple-touch-icon.html"
       magick icon-540.png -resize 180x180 apple-touch-icon.png
       magick icon-540.png -resize 32x32 favicon-32.png && rm icon-540.png -->
