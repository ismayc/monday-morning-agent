<!doctype html><meta charset="utf-8"><title>Link preview source: the series</title>
<!-- Source for og-image.png (1200x630), the series page's link preview. Each episode
     folder has its own. Re-render: serve docs/ locally (python3 -m http.server 8791),
     then with a throwaway profile:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --user-data-dir=/tmp/og-profile \
         --window-size=1200,630 --hide-scrollbars --screenshot=og-image.png http://127.0.0.1:8791/og-image.html
     Needs the network once, for the Barlow fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="sheet.css">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative}
  .pad{position:absolute;inset:0;padding:40px 60px}
  .who{font-family:var(--display);font-weight:600;font-size:30px;border-bottom:4px solid var(--ink);padding-bottom:10px;display:flex;justify-content:space-between}
  .who span:last-child{font-weight:500}
  h1{margin-top:24px;font-size:104px;max-width:none;line-height:.9;white-space:nowrap}
  .args{margin-top:46px;border:2px solid var(--ink);background:#fff}
  .args div{display:grid;grid-template-columns:76px 1fr;border-bottom:2px solid var(--ink);font-family:var(--display);font-weight:700;font-size:48px;line-height:1}
  .args div:last-child{border-bottom:0}
  .args i{font-style:normal;text-align:center;border-right:2px solid var(--ink);padding:13px 0 11px}
  .args span{padding:13px 20px 11px}
  .args div:first-child{background:var(--yellow)}
</style>
<div class="pad">
  <div class="who"><span>The Monday Morning Agent</span><span>Eight arguments, a quarter of a million NFL plays</span></div>
  <h1>An agent that checks the tape.</h1>
  <div class="args">
    <div><i>1</i><span>"You have to establish the run."</span></div>
    <div><i>2</i><span>"Ban the tush push."</span></div>
    <div><i>3</i><span>"Kickers are too good now."</span></div>
    <div><i>5</i><span>"Coaches are cowards on fourth down."</span></div>
  </div>
</div>
