<!doctype html><meta charset="utf-8"><title>Link preview source</title>
<!-- Source for og-image.png (1200x630), episode 2's link preview. Re-render: serve docs/
     locally (python3 -m http.server 8793), then with a throwaway profile:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --user-data-dir=/tmp/og-profile \
         --window-size=1200,630 --hide-scrollbars --screenshot=og-image.png http://127.0.0.1:8793/episode-2/og-image.html
     Needs the network once, for the Barlow fonts. The one number is the name search from
     episode-2/query-plays.mjs (--search "tush push" --seasons 2021-2026, run October 12,
     2026: 0 of 260,927). No conversion numbers: the answer is held back until the episode
     airs on October 26, 2026. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../sheet.css">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative}
  .pad{position:absolute;inset:0;padding:34px 60px}
  .who{font-family:var(--display);font-weight:600;font-size:30px;border-bottom:4px solid var(--ink);padding-bottom:8px;display:flex;justify-content:space-between}
  .who span:last-child{font-weight:500}
  h1{margin-top:22px;font-size:120px;max-width:none;line-height:.9;white-space:nowrap}
  .hook{margin-top:36px;display:grid;grid-template-columns:auto 1fr;gap:0 40px;align-items:center}
  .zero{font-family:var(--display);font-weight:700;font-size:320px;line-height:.8;background:var(--pink);border:3px solid var(--ink);padding:26px 54px 12px;font-variant-numeric:tabular-nums}
  .said{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.04;max-width:none}
  .so{margin-top:24px;font-family:var(--display);font-weight:500;font-size:42px;line-height:1.1;max-width:none}
  .so b{font-weight:700;background:var(--yellow);padding:0 6px}
</style>
<div class="pad">
  <div class="who"><span>The Monday Morning Agent</span><span>Episode 2, October 26, 2026</span></div>
  <h1>"Ban the tush push."</h1>
  <div class="hook">
    <div class="zero">0</div>
    <div>
      <p class="said">plays named tush push in 260,927 play descriptions, 2021 to 2026</p>
      <p class="so">so the agent has to <b>define it</b> before it can judge it.</p>
    </div>
  </div>
</div>
